services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_started

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://laut:laut@database:5432/laut
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: laut
      POSTGRES_USER: laut
      POSTGRES_PASSWORD: laut
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laut -d laut"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
